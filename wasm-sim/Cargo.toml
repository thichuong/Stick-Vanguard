[package]
name = "wasm-sim"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"
js-sys = "=0.3.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

