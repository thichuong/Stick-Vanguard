  <path d="M12 2.5a9.5 9.5 0 1 0 9.5 9.5c0-.6-.06-1.2-.18-1.8A7.8 7.8 0 1 1 10.2 2.68c.6-.12 1.2-.18 1.8-.18z" fill="url(#darkAura)" />
