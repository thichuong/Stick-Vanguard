<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Majestic Horn Gradient: Ivory Gold Tip -> Fiery Orange -> Deep Crimson-Bronze -->
    <linearGradient id="dragonHorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Dragon Scale Armor: Chiseled Warm Gradient -->
    <linearGradient id="dragonScale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="25%" stop-color="#fb923c" />
      <stop offset="65%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Glowing Eye: Radiant Golden Core -->
    <linearGradient id="dragonEye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Dragon Breath Ember Glow -->
    <radialGradient id="dragonMouthFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
  </defs>

  <!-- ================= 1. MULTIPLE MAJESTIC HORNS (NHIỀU SỪNG UY DŨNG) ================= -->
  <!-- 1.1 Cặp Đại Sừng Chính (Great Sweeping Antler Horns) -->
  <path d="M9 6.2 C6.8 3.5 3.8 1.5 1 0.8 C1.8 3.5 4.5 6 7.5 7.5 Z" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.5" stroke-linejoin="round" />
  <path d="M1 0.8 C3 2.5 5.8 4.8 7.8 6.2" fill="none" stroke="#fef08a" stroke-width="0.6" stroke-linecap="round" />
  <!-- Gai nhánh sừng trái -->
  <polygon points="4.2,2.6 1.8,3 3.2,4.5" fill="#fef08a" stroke="#451a03" stroke-width="0.3" />
  <polygon points="6.8,4.5 4.8,5.4 6,6.4" fill="#fef08a" stroke="#451a03" stroke-width="0.3" />

  <!-- Right Great Horn -->
  <path d="M15 6.2 C17.2 3.5 20.2 1.5 23 0.8 C22.2 3.5 19.5 6 16.5 7.5 Z" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.5" stroke-linejoin="round" />
  <path d="M23 0.8 C21 2.5 18.2 4.8 16.2 6.2" fill="none" stroke="#fef08a" stroke-width="0.6" stroke-linecap="round" />
  <!-- Gai nhánh sừng phải -->
  <polygon points="19.8,2.6 22.2,3 20.8,4.5" fill="#fef08a" stroke="#451a03" stroke-width="0.3" />
  <polygon points="17.2,4.5 19.2,5.4 18,6.4" fill="#fef08a" stroke="#451a03" stroke-width="0.3" />

  <!-- 1.2 Cặp Sừng Phụ Phía Trên (Secondary Upper Horns) -->
  <path d="M7 7.5 C4.5 6.2 2.5 5 0.8 4.2 C1.8 6.8 4 8.5 6.2 9.2 Z" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.4" stroke-linejoin="round" />
  <path d="M17 7.5 C19.5 6.2 21.5 5 23.2 4.2 C22.2 6.8 20 8.5 17.8 9.2 Z" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.4" stroke-linejoin="round" />

  <!-- 1.3 Cặp Sừng Thái Dương (Temple Horns) -->
  <path d="M6 9.8 C3.8 9.2 2 8.8 0.5 8 C1.2 10.2 3.2 11.5 5.5 11.8 Z" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.4" stroke-linejoin="round" />
  <path d="M18 9.8 C20.2 9.2 22 8.8 23.5 8 C22.8 10.2 20.8 11.5 18.5 11.8 Z" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.4" stroke-linejoin="round" />

  <!-- 1.4 Cặp Sừng Mang & Gò Má (Cheek Spikes) -->
  <path d="M6 12.5 C3.8 13.2 2 13.8 0.8 14.8 C2.5 15.5 4.8 15 6.5 14 Z" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.4" stroke-linejoin="round" />
  <path d="M18 12.5 C20.2 13.2 22 13.8 23.2 14.8 C21.5 15.5 19.2 15 17.5 14 Z" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.4" stroke-linejoin="round" />

  <!-- 1.5 Gai Quai Hàm (Jaw Spikes) -->
  <path d="M6.8 15 C4.5 15.8 2.8 16.8 1.8 17.8 C3.5 18.2 5.5 17.5 7 16.2 Z" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.4" stroke-linejoin="round" />
  <path d="M17.2 15 C19.5 15.8 21.2 16.8 22.2 17.8 C20.5 18.2 18.5 17.5 17 16.2 Z" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.4" stroke-linejoin="round" />

  <!-- 1.6 Chùm Sừng Vương Miện Trung Tâm (Crown Crest Spikes) -->
  <polygon points="12,0.5 13.8,4.5 12,5.5 10.2,4.5" fill="url(#dragonHorn)" stroke="#451a03" stroke-width="0.4" />
  <line x1="12" y1="0.5" x2="12" y2="5.5" stroke="#fef08a" stroke-width="0.6" />
  <!-- Gai trán phụ 2 bên -->
  <polygon points="9.5,2 10.8,4.8 8.5,4.8" fill="#f97316" stroke="#451a03" stroke-width="0.3" />
  <polygon points="14.5,2 13.2,4.8 15.5,4.8" fill="#ea580c" stroke="#451a03" stroke-width="0.3" />

  <!-- ================= 2. ĐẦU RỒNG & KHỐI GIÁP MẶT (CHISELED SCALES) ================= -->
  <!-- Khung đầu rồng góc cạnh (Faceted Dragon Skull) -->
  <polygon points="12,5.2 7,7.2 6,10.5 7.5,13.5 12,14.5 16.5,13.5 18,10.5 17,7.2" fill="url(#dragonScale)" stroke="#451a03" stroke-width="0.6" stroke-linejoin="round" />

  <!-- Phiến giáp trán trung tâm đa giác (Chiseled Brow Plate) -->
  <polygon points="12,5.5 9,7.5 12,9.2 15,7.5" fill="#fed7aa" stroke="#c2410c" stroke-width="0.3" />

  <!-- Mảng bóng sọ bên phải (Shadow Facet) -->
  <polygon points="12,5.5 15,7.5 17,7.2 18,10.5 16.5,13.5 12,14.5 12,9.2" fill="#9a3412" opacity="0.5" />

  <!-- ================= 3. MÕM RỒNG & VÒM MIỆNG (Draw before eyes) ================= -->
  <!-- Thân mõm rộng bọc vảy sừng (Broad Snout) -->
  <polygon points="8,10.8 12,9.8 16,10.8 16.8,15.2 15.5,16.8 8.5,16.8 7.2,15.2" fill="#ea580c" stroke="#7c2d12" stroke-width="0.5" stroke-linejoin="round" />
  <!-- Mảng sáng sống mũi (Left Lit Facet) -->
  <polygon points="8,10.8 12,9.8 12,16.8 8.5,16.8" fill="#fb923c" />
  <!-- Sống mũi ánh kim -->
  <line x1="12" y1="9.8" x2="12" y2="16.8" stroke="#fef08a" stroke-width="0.8" stroke-linecap="round" />

  <!-- Hai lỗ mũi rồng gầm thét (Flared Nostrils) -->
  <ellipse cx="9.5" cy="15.5" rx="0.8" ry="0.5" fill="#1a0500" />
  <ellipse cx="14.5" cy="15.5" rx="0.8" ry="0.5" fill="#1a0500" />

  <!-- Vòm miệng đen sâu & Lửa rồng (Open Maw with Flame) -->
  <polygon points="7.5,16.5 16.5,16.5 15,19.2 12,20.8 9,19.2" fill="#1a0500" stroke="#2a0800" stroke-width="0.5" />
  <ellipse cx="12" cy="18" rx="2.5" ry="1" fill="url(#dragonMouthFire)" />

  <!-- Cặp Răng Nanh Đại Long Khổng Lồ (Curved Ivory Fangs) -->
  <polygon points="7.8,16.2 8.6,19.8 9.6,16.4" fill="#ffffff" stroke="#2a0800" stroke-width="0.3" />
  <polygon points="16.2,16.2 15.4,19.8 14.4,16.4" fill="#ffffff" stroke="#2a0800" stroke-width="0.3" />
  <!-- Răng nanh nhỏ hàm trên -->
  <polygon points="11,16.5 11.5,17.8 12,16.5" fill="#fef08a" />
  <polygon points="12,16.5 12.5,17.8 13,16.5" fill="#fef08a" />

  <!-- ================= 4. CUNG MÀY & MẮT RỒNG THẦN (Rendered on top for sharpness) ================= -->
  <!-- Cặp lông mày rồng bọc giáp hung hãn (Heavy Angry Brows) -->
  <polygon points="12,8.8 6.5,9.5 7.8,10.8 12,10 16.2,10.8 17.5,9.5" fill="#2a0800" />

  <!-- Hốc mắt sâu thẳm -->
  <polygon points="7,9.6 11.2,10.2 10.2,11.8 6.5,11.2" fill="#1a0500" />
  <polygon points="17,9.6 12.8,10.2 13.8,11.8 17.5,11.2" fill="#1a0500" />
  <!-- Mắt rồng rực sáng thần uy -->
  <polygon points="7.5,9.9 10.8,10.4 8.2,11.4" fill="url(#dragonEye)" />
  <polygon points="16.5,9.9 13.2,10.4 15.8,11.4" fill="url(#dragonEye)" />
  <!-- Con ngươi thẳng đứng dữ tợn -->
  <line x1="8.8" y1="9.9" x2="8.8" y2="11.4" stroke="#1a0500" stroke-width="0.6" />
  <line x1="15.2" y1="9.9" x2="15.2" y2="11.4" stroke="#1a0500" stroke-width="0.6" />

  <!-- ================= 5. HÀM DƯỚI & SỪNG CẰM (CHIN HORNS) ================= -->
  <!-- Hàm dưới gập chắc khỏe -->
  <polygon points="8.5,19 12,21 15.5,19 14,22.2 10,22.2" fill="#7c2d12" stroke="#2a0800" stroke-width="0.5" />
  <!-- Răng nanh hàm dưới nhô lên -->
  <polygon points="9.5,20.5 10,19 10.5,20.5" fill="#ffffff" />
  <polygon points="14.5,20.5 14,19 13.5,20.5" fill="#ffffff" />

  <!-- Sừng cằm trung tâm nhọn hoắt vươn xuống -->
  <polygon points="12,23.8 10.6,21.5 13.4,21.5" fill="url(#dragonHorn)" stroke="#2a0800" stroke-width="0.4" />
  <line x1="12" y1="21.5" x2="12" y2="23.8" stroke="#fef08a" stroke-width="0.6" />
  <!-- Gai cằm phụ 2 bên -->
  <polygon points="8.8,22 10.2,20.8 8.5,20.8" fill="url(#dragonHorn)" stroke="#2a0800" stroke-width="0.3" />
  <polygon points="15.2,22 13.8,20.8 15.5,20.8" fill="url(#dragonHorn)" stroke="#2a0800" stroke-width="0.3" />
</svg>
